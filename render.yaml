# Render Blueprint — ONE service serving both the FastAPI API and the built
# React frontend (free-tier friendly; no separate web host required).
#
# Deploy: Render Dashboard → New + → Blueprint → select this GitHub repo.
# Render reads this file and asks for GEMINI_API_KEY (marked sync: false).
#
# Alternatively create a Web Service manually with:
#   Runtime: Python | Root Directory: backend
#   Build Command: bash render-build.sh
#   Start Command: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT

services:
  - type: web
    name: bis-sahayak
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash render-build.sh
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Security — REQUIRED: set a strong random value in the Render dashboard.
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      # LLM — entered once in the Render dashboard (secret).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "8192"
      # Embeddings
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "768"
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      # Retrieval / chunking
      - key: CHUNK_SIZE
        value: "900"
      - key: CHUNK_OVERLAP
        value: "150"
      - key: RETRIEVAL_MODE
        value: hybrid
      # Uploads live here. Free tier: /var/data is ephemeral (resets on redeploy);
      # sample data re-seeds automatically. Attach a disk on paid plans.
      - key: DATA_DIR
        value: /var/data
      # DB: default SQLite lives in backend/data (also ephemeral on free tier).
      # With a paid disk, switch to the persistent path instead:
      #   DATABASE_URL=sqlite:////var/data/bisbuddy.db
      - key: MAX_UPLOAD_MB
        value: "25"
      # First-run seeding of demo users + SAMPLE documents (idempotent).
      - key: SEED_SAMPLE_DATA
        value: "false"
      # CORS — allow any *.onrender.com / *.vercel.app origin plus localhost.
      - key: CORS_ALLOW_REGEX
        value: 'https://.*\.onrender\.com|https://.*\.vercel\.app|http://localhost:5173'
      - key: CORS_ORIGINS
        value: ""
      - key: LOG_LEVEL
        value: INFO

# Persistent disk for uploads + SQLite fallback DB (requires a paid plan;
# comment this block out on the free tier — the app still works, uploads and
# the SQLite DB just reset on redeploy, and sample data re-seeds).
